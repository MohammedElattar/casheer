services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     casheer
      POSTGRES_PASSWORD: casheer
      POSTGRES_DB:       casheer
    ports:
      - "5435:5432"
    volumes:
      - casheer_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casheer -d casheer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  casheer_db:
